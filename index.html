<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moo's Funfair</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Librairies : p5.js (pack local) + TensorFlow.js (pour Bunny Derby) -->
  <script src="assets/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

  <!-- 1. IA Neuro-évolution (reprise de l'exemple 9 du cours) -->
  <script src="ai/NeuralNetwork.js"></script>
  <script src="ai/GeneticAlgorithm.js"></script>
  <script src="ai/TrackBuilder.js"></script>

  <!-- 2. Comportements et véhicules (1 classe par fichier, ordre strict des dépendances) -->
  <script src="behaviors/BehaviorManager.js"></script>
  <script src="vehicles/Vehicle.js"></script>
  <script src="vehicles/Obstacle.js"></script>
  <script src="vehicles/Moo.js"></script>
  <script src="vehicles/FairVisitor.js"></script>
  <script src="vehicles/HubButterfly.js"></script>
  <script src="vehicles/HubDuckling.js"></script>
  <script src="vehicles/CaterpillarSegment.js"></script>
  <script src="vehicles/Caterpillar.js"></script>
  <script src="vehicles/GardenFruit.js"></script>
  <script src="vehicles/GardenPredator.js"></script>
  <script src="vehicles/SparkleFX.js"></script>
  <script src="vehicles/BoidDuckling.js"></script>
  <script src="vehicles/GrumpyGoose.js"></script>
  <script src="vehicles/DerbyBunny.js"></script>
  <script src="vehicles/Projectile.js"></script>
  <script src="vehicles/PowerUp.js"></script>
  <script src="vehicles/FoxBoss.js"></script>

  <!-- 3. Utilitaires UI, sauvegarde, audio et assets -->
  <script src="ui/CosmeticCatalog.js"></script>
  <script src="ui/SaveManager.js"></script>
  <script src="ui/SoundManager.js"></script>
  <script src="ui/AssetManager.js"></script>
  <script src="ui/PixelUI.js"></script>
  <script src="ui/SkyBackdrop.js"></script>
  <script src="ui/PrizeShop.js"></script>
  <script src="ui/PauseMenu.js"></script>

  <!-- 4. Gestionnaire de scènes et scènes du jeu -->
  <script src="scenes/Scene.js"></script>
  <script src="scenes/SceneManager.js"></script>
  <script src="scenes/TitleScene.js"></script>
  <script src="scenes/HubScene.js"></script>
  <script src="scenes/SnakeScene.js"></script>
  <script src="scenes/DucklingScene.js"></script>
  <script src="scenes/DerbyScene.js"></script>
  <script src="scenes/FoxScene.js"></script>

  <!-- 5. Point d'entrée p5.js -->
  <script src="sketch.js"></script>
</head>
<body>
  <div id="hud-controls">
    <button id="fullscreen-btn" class="hud-pill" type="button" title="Toggle Fullscreen (F)">[F] Fullscreen</button>
    <div id="hub-shortcuts">
      <button id="btn-menu"  class="hud-pill hud-pill-sm" type="button" title="Open Book Menu (Esc)">[Esc] Menu</button>
      <button id="btn-debug" class="hud-pill hud-pill-sm" type="button" title="Toggle Debug Mode (H)">[H] Debug</button>
      <button id="btn-map"   class="hud-pill hud-pill-sm" type="button" title="Open Funfair Map (M)">[M] Map</button>
      <button id="btn-games" class="hud-pill hud-pill-sm" type="button" title="Pick a Mini-Game (P)">[P] Games</button>
      <span   id="btn-interact" class="hud-pill hud-pill-sm hud-pill-hint" title="Press Space to Interact">[Space] Interact</span>
      <span   id="btn-run"   class="hud-pill hud-pill-sm hud-pill-hint" title="Hold Shift to Run">[Shift] Run</span>
    </div>
  </div>
  <div id="wish-modal" aria-hidden="true">
    <div class="wish-card">
      <div class="wish-header">WISHING FOUNTAIN</div>
      <p class="wish-sub">Type your secret wish and toss a lucky sparkle into the water:</p>
      <input id="wish-input" type="text" maxlength="64" placeholder="I wish for..." autocomplete="off" />
      <div class="wish-actions">
        <button id="wish-submit" class="hud-pill hud-pill-sm" type="button">Toss Wish! (Enter)</button>
        <button id="wish-cancel" class="hud-pill hud-pill-sm" type="button">Cancel (Esc)</button>
      </div>
    </div>
  </div>
</body>
</html>
